# NORA — contoh konfigurasi Nginx
#
# 1. Ganti nora.contoh.com dengan domain Anda.
# 2. Salin ke /etc/nginx/sites-available/nora dan symlink ke sites-enabled.
# 3. Jalankan: sudo nginx -t && sudo systemctl reload nginx
# 4. Terbitkan sertifikat: sudo certbot --nginx -d nora.contoh.com
#
# Certbot biasanya menambahkan blok listen 443 dan mengalihkan HTTP ke HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name nora.contoh.com;

    # Biarkan Certbot mengisi konfigurasi TLS. Untuk sementara, teruskan HTTP.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload media (default backend 200 MB) + headroom multipart.
        client_max_body_size 210m;

        # Pemindaian video dan panggilan AI dapat memakan waktu.
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE /api/scans/{id}/events tidak boleh dibuffer.
        proxy_buffering off;
        proxy_cache off;
    }

    # Kompres aset statis agar Three.js/Tailwind tidak dikirim mentah.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
}
